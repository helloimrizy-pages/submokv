[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "submokv"
version = "0.1.0"
description = "Joint allocation of a memory budget between expert weight bit widths and KV cache retention"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["submokv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
