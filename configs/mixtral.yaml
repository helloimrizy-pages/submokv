# Optional high-VRAM configuration for mistralai/Mixtral-8x7B-v0.1.
model:
  name: mistralai/Mixtral-8x7B-v0.1
  num_hidden_layers: 32
  hidden_size: 4096
  intermediate_size: 14336
  num_attention_heads: 32
  num_key_value_heads: 8
  num_experts: 8
  num_experts_per_tok: 2
  vocab_size: 32000
  max_position_embeddings: 32768
  tie_word_embeddings: false
  attention_bias: false
  has_qk_norm: false
  dtype_bytes: 2

kv:
  context_length: 2048
  batch_size: 1
  dtype_bytes: 2
  sink_tokens: 4

quant:
  group_size: 128
  scale_bits: 16
  zero_point_bits: 0
  symmetric: true
  unquantized_bits: 16

ground_set:
  weight_tiers: [3, 4, 8, 16]
  kv_tiers: [0.25, 0.50, 0.75, 1.00]
  weight_groups_per_layer: 1

seed: 0

retention:
  policy: recency_sink
  sink_tokens: 4

protocol:
  name: prefill_evict_decode
  prefill_tokens: 1536
  chunk_size: 256

calibration:
  dataset: Salesforce/wikitext
  subset: wikitext-2-raw-v1
  calibration_split: validation
  evaluation_split: test
  sequence_length: 2048
  cheap_sequences: 64
  full_sequences: 128
  seed: 0

runtime:
  device: null
  dtype: bfloat16
  attn_implementation: null
  master_store: checkpoint

submodularity:
  test_layers: [2, 10, 18, 26]
  # Must name tiers that ground_set.weight_tiers / kv_tiers contain.
  weight_upgrades: [[3, 4]]
  kv_upgrades: [[0.25, 0.50]]
  epsilon_ppl: 0.01
  epsilon_source: "UNMEASURED placeholder, pending Milestone 3b Task B"
