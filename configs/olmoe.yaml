# Sub-MoKV configuration for OLMoE-1B-7B.
#
# The model block mirrors the fields of the Hugging Face config at
# allenai/OLMoE-1B-7B-0924, retrieved 2026-08-19. Byte accounting reads these
# numbers directly, so it runs without downloading weights.

model:
  name: allenai/OLMoE-1B-7B-0924
  num_hidden_layers: 16
  hidden_size: 2048
  intermediate_size: 1024
  num_attention_heads: 16
  num_key_value_heads: 16
  num_experts: 64
  num_experts_per_tok: 8
  vocab_size: 50304
  max_position_embeddings: 4096
  tie_word_embeddings: false
  attention_bias: false
  # OLMoE normalizes queries and keys, so those weights are counted.
  has_qk_norm: true
  dtype_bytes: 2

kv:
  # Declared context length for KV accounting. The model was trained with
  # max_position_embeddings 4096, so 4096 is the largest value that needs no
  # position interpolation.
  context_length: 4096
  batch_size: 1
  dtype_bytes: 2
  sink_tokens: 4

quant:
  group_size: 128
  scale_bits: 16
  # Symmetric quantization stores no zero point.
  zero_point_bits: 0
  symmetric: true
  unquantized_bits: 16

ground_set:
  weight_tiers: [2, 3, 4, 8, 16]
  kv_tiers: [0.25, 0.50, 0.75, 1.00]
  # 1 puts every expert in a layer on a single ladder. Raising this splits a
  # layer's experts into that many contiguous groups, each with its own ladder.
  weight_groups_per_layer: 1

budgets:
  # Fractions of the reference footprint, which is every expert at 16 bits and
  # every layer's cache retained in full.
  fractions: [0.15, 0.20, 0.25, 0.35]

seed: 0
