# Sub-MoKV configuration for OLMoE-1B-7B at PER-EXPERT weight granularity.
#
# Identical to configs/olmoe.yaml except for ground_set.weight_groups_per_layer.
# Used only by `diagnostic-1-per-expert`, which tests whether a
# sensitivity-driven per-expert assignment beats random at matched budget.
#
# The model block mirrors the fields of the Hugging Face config at
# allenai/OLMoE-1B-7B-0924, retrieved 2026-08-19. Byte accounting reads these
# numbers directly, so it runs without downloading weights.

model:
  name: allenai/OLMoE-1B-7B-0924
  num_hidden_layers: 16
  hidden_size: 2048
  intermediate_size: 1024
  num_attention_heads: 16
  num_key_value_heads: 16
  num_experts: 64
  num_experts_per_tok: 8
  vocab_size: 50304
  max_position_embeddings: 4096
  tie_word_embeddings: false
  attention_bias: false
  # OLMoE normalizes queries and keys, so those weights are counted.
  has_qk_norm: true
  dtype_bytes: 2

kv:
  # Declared context length for KV accounting. The model was trained with
  # max_position_embeddings 4096, so 4096 is the largest value that needs no
  # position interpolation.
  context_length: 4096
  # Batch is the KV lever at native context. At batch 1 the KV ladder is a few
  # percent of the buyable budget, too small for an interaction term to show.
  batch_size: 4
  dtype_bytes: 2
  sink_tokens: 4

quant:
  group_size: 128
  scale_bits: 16
  # Symmetric quantization stores no zero point.
  zero_point_bits: 0
  symmetric: true
  unquantized_bits: 16

ground_set:
  weight_tiers: [3, 4, 8, 16]
  kv_tiers: [0.25, 0.50, 0.75, 1.00]
  # One ladder per EXPERT, not per layer. This is the granularity the
  # per-expert claim in MoPEQ, MxMoE and BT-MoE is about: 16 layers x 64
  # experts = 1024 weight units. The ground set signature differs from the
  # per-layer config, so the two share no memoized evaluations, which is
  # correct because they are different allocations.
  weight_groups_per_layer: 64

budgets:
  # Fractions of the reference footprint, which is every expert at 16 bits and
  # every layer's cache retained in full.
  fractions: [0.25, 0.35, 0.50, 0.70]

seed: 0

retention:
  # The retained set differs between policies, so the one in use is pinned here
  # and copied into every result record. sink_tokens must match kv.sink_tokens.
  policy: recency_sink
  sink_tokens: 4
  # attention_score also reads recent_window:
  # policy: attention_score
  # recent_window: 32

protocol:
  # What the retained set is anchored to. Prefill a prefix with full attention,
  # apply the policy to it, then score the tail only, holding the visible cache
  # at the budget. This is the reading memory.py charges for.
  name: prefill_evict_decode
  prefill_tokens: 3072
  chunk_size: 256

calibration:
  dataset: Salesforce/wikitext
  subset: wikitext-2-raw-v1
  # F reads the calibration split. Results are reported on the evaluation
  # split. The two are checked to share no window.
  calibration_split: train
  evaluation_split: test
  sequence_length: 4096
  cheap_sequences: 64
  full_sequences: 256
  seed: 0

runtime:
  # Left unset so the same config runs on whatever machine holds the weights.
  # The device that produced a number is recorded with it, and the memoization
  # file is named for it, because results are not comparable across devices.
  device: null
  # The checkpoint is bfloat16, so loading in bfloat16 converts nothing.
  dtype: bfloat16
  # attention_score needs eager, the only implementation that returns attention
  # weights. recency_sink runs under sdpa. Left null to follow the policy.
  attn_implementation: null
  # The memory master would cost 12 GiB on top of the resident model, which
  # does not leave room for a batched cache on this machine.
  master_store: checkpoint

submodularity:
  # OLMoE has 16 layers, so the 32-layer Mixtral grid [2, 10, 18, 26] is not
  # valid here. These four indices cover early, early-middle, late-middle, and
  # late OLMoE blocks without silently clipping a requested layer.
  test_layers: [2, 6, 10, 14]

  # TARGET moves are adjacent steps only. Every tier named must appear in
  # ground_set.weight_tiers / ground_set.kv_tiers; the ground set is the single
  # source of truth and a move off its ladder is refused.
  weight_upgrades: [[3, 4], [4, 8]]
  kv_upgrades: [[0.25, 0.50], [0.50, 0.75]]

  # CONDITIONING moves stay LARGE, and the asymmetry with the target moves is
  # deliberate. Adjacent conditioning would put S_A and S_B so close together
  # that nothing could resolve, for reasons about the design rather than about
  # the model. The output states this so a reader does not assume symmetry.
  weight_conditioning: [[3, 16]]
  kv_conditioning: [[0.25, 1.00]]

  # Both tolerances are DERIVED from a measured floor record passed as --floor,
  # never transcribed, so the epsilon a cell is compared against cannot drift
  # from the floor it came from. What lives here is only what DECISION.md fixes
  # and a measurement cannot supply.
  #
  # k, the number of calibration draws averaged into one cell. epsilon is
  # sigma2/sqrt(k) per DECISION.md Amendment 1, and a run whose subsample count
  # differs from this fails loudly rather than classifying against the wrong
  # tolerance.
  epsilon_cell_subsamples: 3
  # The effect gate of DECISION.md Amendment 2 B. E1 is m > multiple * sigma1,
  # E2 is |D| >= phi * m. phi = 0.10 was derived from the median adjacent-rank
  # gap in the greedy ranking, 8.1% pooled over the four real ladder steps,
  # rounded up so the gate is harder to pass rather than easier.
  effect_relative_phi: 0.10
  effect_noise_multiple: 3.0

  # Only used by a run that passes no --floor. A classifying run must pass one.
  epsilon_ppl: 0.01
  epsilon_source: "UNMEASURED placeholder; a classifying run must pass --floor"
